name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        # Disposable values for a database that exists only during this job.
        env:
          POSTGRES_DB: taskflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        # Steps start only after this check passes.
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Read by config/settings.py. No .env file exists on the runner.
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      DB_ENGINE: postgres
      POSTGRES_DB: taskflow_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
