{% extends "tasks/base.html" %}

{% block title %}Create Task | TaskFlow{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h1 class="page-title">Create Task</h1>
        <p class="page-subtitle">Add a new task to your board.</p>
    </div>

    <div class="card form-card">
        <form method="POST" class="task-form">
            {% csrf_token %}
            {% include "tasks/_form_fields.html" %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Task</button>
                <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
